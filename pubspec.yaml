name: gulfwalkin_app
description: "Gulfwalkin Overseas Employment Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1

  # Navigation
  go_router: ^13.2.0

  # Auth & Storage
  google_sign_in: ^6.2.1

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.4
  flutter_local_notifications: ^18.0.1

  # File / Media
  image_picker: ^1.1.1
  file_picker: ^8.0.3
  syncfusion_flutter_pdfviewer: ^33.2.13
  cached_network_image: ^3.3.1

  # Local cache
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2

  # UI
  shimmer: ^3.0.0
  lottie: ^3.1.1
  share_plus: ^12.0.2
  url_launcher: ^6.3.0
  webview_flutter: ^4.7.0
  percent_indicator: ^4.2.3
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
